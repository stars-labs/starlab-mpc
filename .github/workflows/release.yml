name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (defaults to current ref name)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            ext: tar.gz
            bin_ext: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-aarch64
            ext: tar.gz
            bin_ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-arm64
            ext: tar.gz
            bin_ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: macos-x86_64
            ext: tar.gz
            bin_ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            ext: zip
            bin_ext: .exe

    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Build release binaries
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p starlab-client --bin starlab-tui
          -p starlab-cli --bin starlab-cli
          -p starlab-signal-server --bin starlab-signal-server

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          STAGE="starlab-mpc-${TAG}-${{ matrix.asset }}"
          mkdir -p "dist/${STAGE}"
          for bin in starlab-tui starlab-cli starlab-signal-server; do
            cp "target/${{ matrix.target }}/release/${bin}" "dist/${STAGE}/"
            chmod +x "dist/${STAGE}/${bin}"
          done
          [ -f README.md ] && cp README.md "dist/${STAGE}/"
          [ -f LICENSE ] && cp LICENSE "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          rm -rf "dist/${STAGE}"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $stage = "starlab-mpc-$tag-${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          foreach ($bin in @("starlab-tui.exe", "starlab-cli.exe", "starlab-signal-server.exe")) {
            Copy-Item "target/${{ matrix.target }}/release/$bin" "dist/$stage/"
          }
          if (Test-Path README.md) { Copy-Item README.md "dist/$stage/" }
          if (Test-Path LICENSE) { Copy-Item LICENSE "dist/$stage/" }
          Compress-Archive -Path "dist/$stage/*" -DestinationPath "dist/$stage.zip" -Force
          Remove-Item -Recurse -Force "dist/$stage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: starlab-mpc-${{ matrix.asset }}
          path: dist/starlab-mpc-*

  publish:
    name: Publish GitHub Release
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Starlab MPC Engine, TUI & CLI ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            ## Starlab MPC — TUI, Headless CLI & Signal Server (${{ inputs.tag || github.ref_name }})

            Each archive bundles three pre-built native binaries:
            - `starlab-tui` — Terminal UI (online WebRTC mesh + offline air-gap cold storage)
            - `starlab-cli` — Headless CLI & automation daemon (`wallet`, `sign`, `serve`, `reshare`)
            - `starlab-signal-server` — Self-hostable WebRTC signaling relay

            ### Quick Install
            Download the archive matching your OS & CPU architecture below, extract it, and verify against `SHA256SUMS.txt`.

            - **Guide & Walkthrough**: https://starslab-app.freeman-xiong.workers.dev/wallet
            - **Desktop GUI**: https://github.com/stars-labs/starlab-desktop/releases
            - **Browser Extension**: https://github.com/stars-labs/starlab-wallet/releases
          files: release-assets/*
