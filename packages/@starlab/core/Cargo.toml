[package]
name = "starlab-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Ciphersuite-generic FROST threshold-signature core: DKG, signing, and a unified multi-curve (ed25519 + secp256k1) keystore."
keywords = ["frost", "mpc", "threshold", "signature", "cryptography"]
categories = ["cryptography"]

[dependencies]
# FROST dependencies
frost-core = { version = "3.0.0", features = ["serde"] }
frost-secp256k1-tr = { version = "3.0.0", features = ["serde"] }
frost-ed25519 = { version = "3.0.0", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
hex = "0.4.3"
base64 = "0.23.1"

# Cryptography
sha2 = "0.11.0"
sha3 = "0.12.0"
k256 = "0.14.0"
# RNG stack: rand_core/rand_chacha 0.10 + getrandom 0.4 (SysRng). frost-core
# 3.0 still takes rand_core 0.6 traits; `src/rng.rs` bridges at that boundary
# via frost's own `rand_core` re-export.
rand_core = "0.10"
rand_chacha = "0.10"
# Inherits workspace-level version + wasm_js feature. This crate is
# compiled into both native (TUI) and wasm32 (core-wasm) targets, so
# the js backend needs to be activated centrally to avoid rebuilding
# with inconsistent features per target.
getrandom = { workspace = true, features = ["sys_rng"] }
hkdf = "0.13"

# Encryption for keystore
aes-gcm = "0.11.1"
argon2 = "0.6"
pbkdf2 = "0.13"
hmac = "0.13"
password-hash = "0.6"

# Threshold ECDSA (CGGMP24) for EVM accounts — see `src/ecdsa/`. Default
# `backend-num-bigint` (pure Rust, builds for wasm32). `round-based`,
# `hd-wallet` and `generic-ec` are used through cggmp24's re-exports so their
# versions always match the ones cggmp24 was built against.
cggmp24 = { version = "=0.7.0-alpha.3", features = ["curve-secp256k1", "hd-wallet", "state-machine"] }
# PIN-ONLY (not imported): cggmp24 0.7.0-alpha.3 asks for `^0.7.0-alpha.3` of
# these, which resolves to alpha.4 — and alpha.4 moved to generic-ec 0.5 /
# key-share 0.7, so cggmp24 alpha.3 no longer compiles against it. Pinning in
# the manifest (not just Cargo.lock) keeps downstream lockfiles (starlab-desktop)
# resolving the same working set. Drop when bumping cggmp24.
cggmp24-keygen = "=0.7.0-alpha.3"
paillier-zk = { version = "=0.7.0-alpha.3", default-features = false }
# Wire encoding of the ECDSA protocol messages (RFC 8949 CBOR): compact,
# standardized, self-describing (safe for every serde impl cggmp24 uses).
ciborium = "0.2"

# Other
bs58 = "0.5"
bech32 = "0.12"
thiserror = "2.0.21"

[dev-dependencies]
# Only examples/dkg.rs uses clap (argument parsing). No tests in this
# crate currently; no async in the examples either.
clap = { version = "4.6.7", features = ["derive"] }
# Third FROST ciphersuite used ONLY in curve_registry tests, to prove a curve
# beyond ed25519/secp256k1 registers and runs DKG with zero engine edits (#35).
# Same ZCash FROST 3.0 line as the production curves.
frost-ristretto255 = { version = "3.0.0", features = ["serde"] }
# (bincode removed: the examples don't use it and bincode 3.x reshuffled the
# serde integration. If a future example needs binary encoding, pull in
# `bincode_serde` or ciborium explicitly at that point.)
