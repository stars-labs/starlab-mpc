[package]
name = "starlab-hw-protocol"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SLHW v1 protocol, encrypted NVS vault, HAL, and FROST hardware-share engine shared by Starlab ESP32 firmware and host simulators."
keywords = ["frost", "mpc", "esp32", "hardware-wallet", "threshold"]
categories = ["cryptography", "embedded"]

[dependencies]
starlab-core = { path = "../core" }

frost-core = { workspace = true }
frost-ed25519 = { workspace = true }
frost-secp256k1-tr = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

aes-gcm = "0.11.1"
hkdf = "0.13"
hmac = "0.13"
pbkdf2 = "0.13"
sha2 = "0.11.1"
subtle = "2.6"
zeroize = { version = "1.9", features = ["derive"] }
rand_core = "0.10"
thiserror = "2.0.21"
