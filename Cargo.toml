[workspace]
members = [
    "apps/tui",
    "apps/cli",
    "apps/signal-server/server",
    "apps/signal-server/cloudflare-worker",
    "packages/@starlab/core",
    "packages/@starlab/core-wasm",
    "packages/@starlab/blockchain",
]
# Bare `cargo run` at the workspace root is ambiguous (starlab-cli,
# starlab-signal-server and starlab-tui are all binaries), so point the
# default at the terminal UI — the app you normally want to launch.
# Package-scoped commands keep working: `cargo run -p starlab-cli`,
# `cargo test --workspace`, `cargo build -p starlab-signal-server`.
default-members = ["apps/tui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Stars Labs"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stars-labs/starlab-mpc"
homepage = "https://github.com/stars-labs/starlab-mpc"

[workspace.dependencies]
# Common dependencies shared across workspace members
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
base64 = "0.23.1"
# getrandom 0.4 renamed the "js" feature to "wasm_js" (activates the
# js-sys/wasm-bindgen backend so wasm32-unknown-unknown builds can
# call `crypto.getRandomValues`). Without this, wasm-pack builds
# error with "the wasm*-unknown-unknown targets are not supported by
# default". Workspace members inherit via `getrandom.workspace = true`.
getrandom = { version = "0.4", features = ["wasm_js"] }

# FROST dependencies. Members currently pin these directly rather than
# inheriting from the workspace — keeping the versions here in sync so
# that any future `frost-core.workspace = true` doesn't silently pull
# a different version than the rest of the tree.
frost-core = { version = "3.0.0", features = ["serde"] }
frost-secp256k1-tr = { version = "3.0.0", features = ["serde"] }
frost-ed25519 = { version = "3.0.0", features = ["serde"] }

# Async runtime
tokio = { version = "1.53.1", features = ["full"] }

# WebRTC dependencies
webrtc = "0.21.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Threshold ECDSA (cggmp24, `starlab-core::ecdsa`) is big-integer heavy
# (Paillier + ZK proofs over num-bigint): unoptimized it is 10-50x slower,
# which pushes the in-process aux-info/keygen/signing tests past many
# minutes. Optimize just that arithmetic stack in dev/test builds; our own
# crates keep fast, debuggable dev builds.
[profile.dev.package.num-bigint]
opt-level = 3
[profile.dev.package.num-integer]
opt-level = 3
[profile.dev.package.fast-paillier]
opt-level = 3
[profile.dev.package.paillier-zk]
opt-level = 3
[profile.dev.package.cggmp24]
opt-level = 3
[profile.dev.package.cggmp24-keygen]
opt-level = 3
[profile.dev.package.generic-ec]
opt-level = 3
[profile.dev.package.generic-ec-curves]
opt-level = 3
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
